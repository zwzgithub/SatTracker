# Mirrors CelesTrak GP TLE groups into tle/<group>.txt every 6 h.
# The app uses this same-origin copy only if a direct CelesTrak fetch fails
# (network hiccup, CORS change, rate limit), so the phone always has fresh-ish TLEs.
name: Mirror CelesTrak TLEs
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TLE groups
        run: |
          mkdir -p tle
          for g in starlink oneweb qianfan hulianwang kuiper gps-ops glo-ops galileo beidou \
                   iridium-NEXT globalstar orbcomm planet spire geo stations amateur visual; do
            if curl -fsS --retry 3 --max-time 60 -A "constellation-tracker-pwa mirror (GitHub Actions)" \
                 "https://celestrak.org/NORAD/elements/gp.php?GROUP=${g}&FORMAT=tle" -o "tle/${g}.tmp" \
               && grep -q '^1 ' "tle/${g}.tmp"; then
              mv "tle/${g}.tmp" "tle/${g}.txt"; echo "ok  ${g} $(grep -c '^1 ' tle/${g}.txt)"
            else
              rm -f "tle/${g}.tmp"; echo "skip ${g}"
            fi
            sleep 3
          done
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add tle
          git diff --cached --quiet || { git commit -m "TLE mirror $(date -u +%FT%TZ)"; git push; }
